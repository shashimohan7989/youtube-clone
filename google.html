<!DOCTYPE html>
<html>
    <head>
        <title>Google</title>
        <style>
            body {
                background-color: rgb(57, 57, 77);
            }

            .para-text{
                font-family: Arial;
                color: white;
                text-align: center;
                padding-top: 30px;

                margin-bottom: 25px;
           
            }

            .search {
                
                width: 600px;
                margin: 40px auto;
                padding: 20px 35px;

            }

            div{
                text-align: center;
            }
        </style>


    </head>

    <body>
        <div >
            <p class="para-text">
                <span style="color: rgb(80, 80, 220);">G</span><span style="color: rgb(198, 0, 0);">o</span><span  style="color: rgb(185, 153, 25);">o</span><span style="color: rgb(80, 80, 220);">g</span><span style="color: green;">l</span><span style="color: rgb(198, 0, 0);">e</span>
            </p>

            <input class="search" type="text" placeholder="Try Searching....">
        </div>


    </body>
</html>
