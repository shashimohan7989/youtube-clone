<!DOCTYPE html>
<html>
    <head>
        <title>FlexBox</title>

    </head>

    <body style="padding-bottom: 1000px">
        <div style="display: flex; flex-direction: row">
            <div style="background-color:blanchedalmond">div 1</div>
            <div style="background-color:rgb(155, 215, 190)">div 2 <p>text</p></div>
        </div>

        <div style="display: flex; margin-top: 10px; flex-direction: row">
            <div style="background-color:blanchedalmond; flex: 1">div 1</div>
            <div style="background-color:rgb(227, 186, 124); width: 100px">div 1</div>
            <div style="background-color:rgb(155, 215, 190); flex: 2">div 2 <p>text</p></div>
            
        </div>

        <div style="display: flex; margin-top: 10px; flex-direction: row">
            <div style="background-color:rgb(227, 186, 124); width: 100px">div 1</div>
            <div style="background-color:blanchedalmond; flex: 1">div 1</div>
            
            <div style="background-color:rgb(155, 215, 190); flex: 2">div 2 <p>text</p></div>
            
        </div>

        <div style="display: flex; 
                    margin-top: 30px;
                    height: 70px;
                    border-width: 1px;
                    border-style: solid;
                    border-color: black;
                    
                    flex-direction: row;
                    justify-content: center;">
            <div style="background-color:rgb(227, 186, 124); width: 100px">div 1</div>
            <div style="background-color:blanchedalmond; width: 100px">div 1</div>
            
            <div style="background-color:rgb(155, 215, 190); width: 100px">div 2 <p>text</p></div>
            
        </div>

        <div style="display: flex; 
                    margin-top: 30px;
                    height: 70px;
                    border-width: 1px;
                    border-style: solid;
                    border-color: black;
                    flex-direction: row;
                    justify-content: space-between;">

            <div style="background-color:rgb(227, 186, 124); width: 100px">div 1</div>
            <div style="background-color:blanchedalmond; width: 100px">div 1</div>
            
            <div style="background-color:rgb(155, 215, 190); width: 100px">div 2 <p>text</p></div>
            
        </div>

        <div style="display: flex; 
                    margin-top: 30px;
                    height: 70px;
                    border-width: 1px;
                    border-style: solid;
                    border-color: black;
                    flex-direction: row;
                    justify-content: space-between;
                    align-items: start; ">

            <div style="background-color:rgb(227, 186, 124); width: 100px">div 1</div>
            <div style="background-color:blanchedalmond; width: 100px">div 2</div>
            
            <div style="background-color:rgb(155, 215, 190); width: 100px">div 3</div>
            
        </div>

    </body>
</html>
