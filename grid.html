<!DOCTYPE html>
<html>
    <head>
        <title>Grid</title>
    </head>
    <body style="padding-bottom: 1000px">
        <div style="display: grid; grid-template-columns: 100px 100px">
            <div style="background-color:bisque">div1</div>
            <div style="background-color:aquamarine">div2</div>
        </div>

        <div style="margin-top: 20px;display: grid; grid-template-columns: 100px 100px">
            <div style="background-color:bisque">div1</div>
            <div style="background-color:aquamarine">div2 <p>text</p></div>
        </div>

        <div style="margin-top: 20px;display: grid; grid-template-columns: 100px 100px 200px">
            <div style="background-color:bisque">div1</div>
            <div style="background-color:aquamarine">div2 <p>text</p></div>
            <div style="background-color:bisque">div1</div>
        </div>

        <div style="margin-top: 20px;display: grid; grid-template-columns: 100px 100px 200px">
            <div style="background-color:bisque">div1</div>
            <div style="background-color:aquamarine">div2 <p>text</p></div>
            <div style="background-color:bisque">div1</div>
            <div style="background-color:aquamarine">div2 <p>text</p></div>
        </div>

        <div style="margin-top: 20px;display: grid; grid-template-columns: 100px 100px 1fr">
            <div style="background-color:bisque">div1</div>
            <div style="background-color:aquamarine">div2 <p>text</p></div>
            <div style="background-color:bisque">div1</div>
        </div>

        <div style="margin-top: 20px;display: grid; grid-template-columns: 100px 1fr 1fr">
            <div style="background-color:bisque">div1</div>
            <div style="background-color:aquamarine">div2 <p>text</p></div>
            <div style="background-color:bisque">div1</div>
        </div>


        <div style="margin-top: 20px;display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: 20px; row-gap: 40px">
            <div style="background-color:bisque; height: 200px">div1</div>
            <div style="background-color:aquamarine;  height: 200px">div2 </div>
            <div style="background-color:bisque;  height: 200px">div1</div>
            <div style="background-color:aquamarine;  height: 200px">div2 </div>
            <div style="background-color:bisque;  height: 200px">div1</div>
            <div style="background-color:aquamarine;  height: 200px">div2 </div>
        </div>
        



    </body>
</html>
